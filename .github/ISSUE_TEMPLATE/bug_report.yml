name: Bug report
description: Report incorrect Skill behavior or platform compatibility.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the behavior and the expected result without including private transcripts.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - ChatGPT Desktop / Codex
        - Codex CLI
        - Claude Code
        - Other Agent Skills-compatible tool
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use fictional or fully anonymized input.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation details
      description: Include the Skill version, invocation form, input format, and relevant non-sensitive logs.
